<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Интерфейс для работы с методами GREEN-API: getSettings, getStateInstance, sendMessage, sendFileByUrl.">
  <title>GREEN-API Console — Тестовое задание</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-layout">
    <div class="console-card">
      <!-- Шапка консоли -->
      <header class="console-header">
        <div class="header-title">
          <span class="status-dot"></span>
          <h1>GREEN-API Console</h1>
        </div>
        <div class="header-status" id="connectionBadgeText">Готов к работе</div>
      </header>

      <!-- Основная сетка: 2 колонки по макету -->
      <main class="console-grid">
        
        <!-- Левая колонка: параметры и вызовы методов -->
        <section class="col-methods" aria-label="Параметры и методы">
          
          <!-- Авторизационные данные -->
          <div class="card-section">
            <div class="input-wrap">
              <label for="idInstance" class="sr-only">idInstance</label>
              <input type="text" id="idInstance" class="app-input" placeholder="idInstance" autocomplete="off" spellcheck="false" required>
            </div>
            <div class="input-wrap has-action">
              <label for="apiTokenInstance" class="sr-only">ApiTokenInstance</label>
              <input type="password" id="apiTokenInstance" class="app-input" placeholder="ApiTokenInstance" autocomplete="off" spellcheck="false" required>
              <button type="button" class="btn-icon" id="btnToggleToken" title="Показать/скрыть токен" aria-label="Показать/скрыть токен">
                <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>
          </div>

          <!-- Кнопки инстанса -->
          <div class="btn-group">
            <button type="button" id="btnGetSettings" class="app-btn btn-action">
              <span class="spinner"></span>
              <span class="btn-text">getSettings</span>
            </button>
            <button type="button" id="btnGetStateInstance" class="app-btn btn-action">
              <span class="spinner"></span>
              <span class="btn-text">getStateInstance</span>
            </button>
          </div>

          <!-- Отправка сообщения (sendMessage) -->
          <div class="card-section">
            <div class="input-wrap">
              <label for="chatIdMessage" class="sr-only">Номер получателя</label>
              <input type="text" id="chatIdMessage" class="app-input" placeholder="77771234567" autocomplete="off">
            </div>
            <div class="input-wrap">
              <label for="messageText" class="sr-only">Текст сообщения</label>
              <textarea id="messageText" class="app-input app-textarea" rows="3" placeholder="Hello World!"></textarea>
            </div>
            <button type="button" id="btnSendMessage" class="app-btn btn-action">
              <span class="spinner"></span>
              <span class="btn-text">sendMessage</span>
            </button>
          </div>

          <!-- Отправка файла по URL (sendFileByUrl) -->
          <div class="card-section">
            <div class="input-wrap">
              <label for="chatIdFile" class="sr-only">Номер получателя</label>
              <input type="text" id="chatIdFile" class="app-input" placeholder="77771234567" autocomplete="off">
            </div>
            <div class="input-wrap">
              <label for="fileUrl" class="sr-only">Ссылка на файл</label>
              <input type="url" id="fileUrl" class="app-input" placeholder="https://my.site.com/img/horse.png" autocomplete="off">
            </div>
            <button type="button" id="btnSendFileByUrl" class="app-btn btn-action">
              <span class="spinner"></span>
              <span class="btn-text">sendFileByUrl</span>
            </button>
          </div>

          <!-- Настройка хоста API (по умолчанию api.green-api.com) -->
          <details class="host-details">
            <summary>Пользовательский API Host</summary>
            <div class="input-wrap mt-2">
              <input type="text" id="apiUrlHost" class="app-input input-subtle" value="https://api.green-api.com" placeholder="https://api.green-api.com">
            </div>
          </details>

        </section>

        <!-- Правая колонка: окно ответа -->
        <section class="col-response" aria-label="Поле ответа">
          <div class="response-header">
            <h2 class="response-title">Ответ:</h2>
            <div class="response-actions">
              <span class="tag-status" id="statusTag" style="display: none;"></span>
              <span class="tag-duration" id="durationTag" style="display: none;"></span>
              <button type="button" class="btn-sm" id="btnCopyResponse" style="display: none;">Копировать</button>
              <button type="button" class="btn-sm" id="btnClearResponse">Очистить</button>
            </div>
          </div>
          <div class="response-box">
            <textarea id="responseOutput" class="response-field" readonly placeholder="Здесь будет отображен JSON-ответ вызванного метода..." spellcheck="false"></textarea>
          </div>
        </section>

      </main>
    </div>
  </div>

  <!-- Всплывающие уведомления (Toast) -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Интерфейс для работы с методами GREEN-API: getSettings, getStateInstance, sendMessage, sendFileByUrl. Тестовое задание.">
  <title>GREEN-API Console — Тестовое задание</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Styles -->
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-wrapper">
    <!-- Window Frame Mockup matching the task sketch -->
    <div class="browser-frame" id="browserFrame">
      <!-- Browser Top Navigation Bar -->
      <header class="browser-header">
        <div class="traffic-lights" aria-hidden="true">
          <span class="dot dot-close"></span>
          <span class="dot dot-minimize"></span>
          <span class="dot dot-maximize"></span>
        </div>
        <div class="nav-controls" aria-hidden="true">
          <button type="button" class="nav-btn" title="Назад" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <button type="button" class="nav-btn" title="Вперед" disabled>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
          </button>
          <button type="button" class="nav-btn" id="btnRefresh" title="Сбросить состояние">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
          </button>
        </div>
        <div class="address-bar">
          <svg class="lock-icon" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          <span class="address-text">https://green-api.com/waInstance/integration</span>
        </div>
        <div class="header-badge">
          <span class="pulse-indicator"></span>
          <span id="connectionBadgeText">API Ready</span>
        </div>
      </header>

      <!-- Main Layout: 2 Columns according to the wireframe -->
      <main class="console-body">
        
        <!-- Left Column: Parameters & Method Actions -->
        <section class="left-column" aria-label="Параметры и методы GREEN-API">
          
          <!-- Credentials Section -->
          <div class="control-group credentials-group">
            <div class="field-item">
              <label for="idInstance" class="field-label sr-only">idInstance</label>
              <input 
                type="text" 
                id="idInstance" 
                class="app-input" 
                placeholder="idInstance" 
                autocomplete="off" 
                spellcheck="false"
                required
              >
            </div>
            <div class="field-item">
              <label for="apiTokenInstance" class="field-label sr-only">ApiTokenInstance</label>
              <input 
                type="password" 
                id="apiTokenInstance" 
                class="app-input" 
                placeholder="ApiTokenInstance" 
                autocomplete="off" 
                spellcheck="false"
                required
              >
              <button type="button" class="btn-toggle-token" id="btnToggleToken" title="Показать/скрыть токен" aria-label="Показать/скрыть токен">
                <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>

          <!-- Quick Action Buttons -->
          <div class="control-group action-buttons-group">
            <button type="button" id="btnGetSettings" class="app-btn btn-action">
              <span class="btn-spinner"></span>
              <span class="btn-text">getSettings</span>
            </button>
            <button type="button" id="btnGetStateInstance" class="app-btn btn-action">
              <span class="btn-spinner"></span>
              <span class="btn-text">getStateInstance</span>
            </button>
          </div>

          <!-- Send Message Group -->
          <div class="control-group message-group">
            <div class="field-item">
              <label for="chatIdMessage" class="field-label sr-only">Номер получателя</label>
              <input 
                type="text" 
                id="chatIdMessage" 
                class="app-input" 
                placeholder="77771234567" 
                autocomplete="off"
              >
            </div>
            <div class="field-item">
              <label for="messageText" class="field-label sr-only">Текст сообщения</label>
              <textarea 
                id="messageText" 
                class="app-textarea" 
                rows="3" 
                placeholder="Hello World!"
              ></textarea>
            </div>
            <button type="button" id="btnSendMessage" class="app-btn btn-action">
              <span class="btn-spinner"></span>
              <span class="btn-text">sendMessage</span>
            </button>
          </div>

          <!-- Send File By URL Group -->
          <div class="control-group file-group">
            <div class="field-item">
              <label for="chatIdFile" class="field-label sr-only">Номер получателя</label>
              <input 
                type="text" 
                id="chatIdFile" 
                class="app-input" 
                placeholder="77771234567" 
                autocomplete="off"
              >
            </div>
            <div class="field-item">
              <label for="fileUrl" class="field-label sr-only">Ссылка на файл</label>
              <input 
                type="url" 
                id="fileUrl" 
                class="app-input" 
                placeholder="https://my.site.com/img/horse.png" 
                autocomplete="off"
              >
            </div>
            <button type="button" id="btnSendFileByUrl" class="app-btn btn-action">
              <span class="btn-spinner"></span>
              <span class="btn-text">sendFileByUrl</span>
            </button>
          </div>

          <!-- Advanced Host Settings (Collapsible, defaults to https://api.green-api.com) -->
          <details class="advanced-settings" id="advancedSettings">
            <summary class="advanced-toggle">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg>
              <span>Пользовательский API Host (по умолчанию api.green-api.com)</span>
            </summary>
            <div class="field-item advanced-input-wrap">
              <input 
                type="text" 
                id="apiUrlHost" 
                class="app-input input-subtle" 
                value="https://api.green-api.com" 
                placeholder="https://api.green-api.com"
              >
            </div>
          </details>

        </section>

        <!-- Right Column: Response Output -->
        <section class="right-column" aria-label="Поле ответа методов">
          <div class="response-header">
            <h2 class="response-title">Ответ:</h2>
            <div class="response-meta">
              <span class="status-tag" id="statusTag" style="display: none;"></span>
              <span class="duration-tag" id="durationTag" style="display: none;"></span>
              <button type="button" class="btn-copy" id="btnCopyResponse" title="Скопировать ответ" aria-label="Скопировать ответ" style="display: none;">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                <span id="copyFeedback">Копировать</span>
              </button>
            </div>
          </div>
          
          <div class="response-container">
            <textarea 
              id="responseOutput" 
              class="response-textarea" 
              readonly 
              placeholder="Здесь будет отображен JSON-ответ вызванного метода..."
              spellcheck="false"
            ></textarea>
          </div>
        </section>

      </main>

      <!-- Footer matching mockup watermark -->
      <footer class="browser-footer">
        <div class="footer-left">
          <span>GREEN-API Integration Console</span>
        </div>
        <div class="footer-brand">
          <span>GREEN API &copy; 2025</span>
        </div>
      </footer>
    </div>
  </div>

  <!-- Notification Toast Container -->
  <div id="toastContainer" class="toast-container" aria-live="polite"></div>

  <!-- Application Logic -->
  <script src="app.js"></script>
</body>
</html>
